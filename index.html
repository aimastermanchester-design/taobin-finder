<style>

:root{color-scheme:light;--ink:#17241f;--muted:#68766f;--green:#146b4b;--line:#e1e8e3;--paper:#fff;--bg:#f3f6f3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{background:#10251f;color:white;padding:17px 17px 15px;padding-top:calc(17px + env(safe-area-inset-top));}
.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:#d9f3e4;color:#145b40;display:grid;place-items:center;font-weight:900;font-size:19px}
h1{font-size:20px;margin:0}header p{margin:5px 0 0;color:#c5d5cc;font-size:12px}
main{max-width:760px;margin:auto;padding:12px 12px 30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:11px 10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.controls{background:white;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
button,select,input{font:inherit}button{border:0;border-radius:11px;background:var(--green);color:white;padding:12px 14px;font-weight:650;cursor:pointer}
button.secondary{background:#e9f1ec;color:#174c37}.buttonrow{display:flex;gap:8px}.buttonrow button{flex:1}
.searchrow{display:flex;gap:8px;margin-top:10px}input,select{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;color:var(--ink)}input{flex:1;width:100%}select{max-width:145px}
.status{font-size:12px;color:var(--muted);margin:9px 2px 0;line-height:1.4}
#map{height:42vh;min-height:290px;max-height:470px;border-radius:15px;border:1px solid var(--line);overflow:hidden;background:#dce7df}
.resultshead{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}.resultshead b{font-size:15px}.resultshead span{font-size:12px;color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.pin{width:35px;height:35px;border-radius:11px;background:#e8f3ec;color:#176344;display:grid;place-items:center;flex:none;font-size:17px}
.info{flex:1;min-width:0}.info b{font-size:14px;display:block;line-height:1.3}.meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.dist{font-size:12px;font-weight:750;white-space:nowrap;color:#145b40}
.actions{display:flex;gap:7px;margin-top:8px}.actions a{font-size:11px;color:#145b40;text-decoration:none;font-weight:700;background:#eef5f0;padding:7px 9px;border-radius:8px}
.pill{display:inline-block;font-size:10px;padding:3px 6px;border-radius:20px;background:#e6f4eb;color:#176344;margin-left:5px}.pill.standby{background:#fff2d9;color:#805500}
.empty{padding:25px;text-align:center;color:var(--muted);background:white;border-radius:13px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:14px 5px}
.leaflet-popup-content{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif}
@media(min-width:650px){main{padding:18px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}#map{height:650px;max-height:none}.listpanel{max-height:650px;overflow:auto}.controls{margin-bottom:12px}}

.meta.en{color:#8a968f;margin-top:2px}.leaflet-popup-content small{color:#68766f}
</style>
</head>

   <select id="statusFilter" style="max-width:none;flex:1"><option value="OPERATING">只顯示營運中</option><option value="">所有狀態</option><option value="STANDBY">只顯示待命中</option></select>
  </div>
  <p class="status" id="statusMsg">按「搜尋附近的機器」並允許定位權限。你的 GPS 位置只會在此瀏覽器中用作計算距離。</p>
 </section>
 <div class="layout">
  <div id="map" aria-label="Taobin 自動售賣機地點地圖"></div>
  <section class="listpanel">
   <div class="resultshead"><b>自動售賣機</b><span id="resultCount">93 個地點</span></div>
   <div id="results"></div>
  </section>
 </div>

"name":"Hong Kong Factory","lat":22.3392,"lon":114.15003,"machineId":"210796","province":"HONG_KONG","type":"FACTORY","status":"STANDBY","zh":"香港工廠"},{"name":"G/F, University Guest House, HKCU","lat":22.42033698,"lon":114.210684,"machineId":"240503","province":"NEW_TERRITORIES","type":"SCHOOL","status":"OPERATING","zh":"香港中文大學 大學賓館 地下"},{"name":"G/F, Sha Tin Industrial Building","lat":22.39806489,"lon":114.1976924,"machineId":"240511","province":"NEW_TERRITORIES","type":"PRIVATE_OFFICE","status":"OPERATING","zh":"沙田工業大廈 地下"}];
const map = L.map('map').setView([22.32,114.17],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markers = L.layerGroup().addTo(map);
let userPosition=null, userMarker=null, circle=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REGION={HONG_KONG:'香港島',KOWLOON:'九龍',NEW_TERRITORIES:'新界'};
const TYPE={PRIVATE_OFFICE:'寫字樓',FACTORY:'工廠',TRANSPORTATION_HUB:'交通樞紐',SHOPPING_MALL:'商場',HOTEL:'酒店',SPORT_ACTIVITY:'運動及活動場地',LAUNDRY_SHOP:'洗衣店',RESIDENTIAL:'住宅',EVENT_HALL:'活動場地',SHOPHOUSE:'商舖',SCHOOL:'學校'};
const STATUS={OPERATING:'營運中',STANDBY:'待命中'};
const region=v=>REGION[v]||v, typeZh=v=>TYPE[v]||String(v).replaceAll('_',' '), statusZh=v=>STATUS[v]||v, label=m=>m.zh||m.name;
const collator=new Intl.Collator('zh-Hant-HK-u-co-stroke');
function distance(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmt(m){return m<1000?Math.round(m)+' 米':(m/1000).toFixed(2)+' 公里'}
function filtered(){
 const q=$('search').value.trim().toLowerCase(),prov=$('province').value,stat=$('statusFilter').value,r=Number($('radius').value);
 let arr=MACHINES.filter(m=>(!q||[m.zh,m.name,m.machineId,region(m.province),typeZh(m.type),statusZh(m.status),m.province,m.type].join(' ').toLowerCase().includes(q))&&(!prov||m.province===prov)&&(!stat||m.status===stat));
 if(userPosition){arr=arr.map(m=>({...m,distance:distance(userPosition,m)}));if(r)arr=arr.filter(m=>m.distance<=r);arr.sort((a,b)=>a.distance-b.distance)}
 else arr.sort((a,b)=>collator.compare(label(a),label(b)));
 return arr;
}
function render(){
 const arr=filtered();markers.clearLayers();
 arr.forEach(m=>{
  const color=m.status==='OPERATING'?'#16734f':'#c18a20';
  const marker=L.circleMarker([m.lat,m.lon],{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).bindPopup(`<b>${esc(label(m))}</b><br><small>${esc(m.name)}</small><br>${esc(region(m.province))}<br>${esc(statusZh(m.status))}<br>機器編號：${esc(m.machineId)}`);
  marker.addTo(markers);
 });
 $('resultCount').textContent=arr.length+' 個地點';
 $('results').innerHTML=arr.length?arr.map(m=>`<article class="card"><div class="pin">☕</div><div class="info"><b>${esc(label(m))}<span class="pill ${m.status==='STANDBY'?'standby':''}">${esc(statusZh(m.status))}</span></b><div class="meta en">${esc(m.name)}</div><div class="meta">${esc(region(m.province))} · ${esc(typeZh(m.type))}<br>機器編號：${esc(m.machineId)}${m.distance!==undefined?' · 距離約 '+fmt(m.distance):''}</div><div class="actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}">取得路線 ↗</a><a href="#" data-lat="${m.lat}" data-lon="${m.lon}" class="zoom">在地圖顯示</a></div></div>${m.distance!==undefined?`<div class="dist">${fmt(m.distance)}</div>`:''}</article>`).join(''):'<div class="empty">沒有符合篩選條件的機器。請嘗試放寬距離或選擇其他地區。</div>';
 document.querySelectorAll('.zoom').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const lat=+a.dataset.lat,lon=+a.dataset.lon;map.setView([lat,lon],17);markers.eachLayer(x=>{if(x.getLatLng().lat===lat&&x.getLatLng().lng===lon)x.openPopup()})}));
}
function locate(){
 $('statusMsg').textContent='正在取得你的位置…';
 if(!navigator.geolocation){$('statusMsg').textContent='此瀏覽器不支援定位功能。';return}
 navigator.geolocation.getCurrentPosition(pos=>{
  userPosition={lat:pos.coords.latitude,lon:pos.coords.longitude};
  if(userMarker)map.removeLayer(userMarker);if(circle)map.removeLayer(circle);
  userMarker=L.circleMarker([userPosition.lat,userPosition.lon],{radius:9,color:'#fff',weight:3,fillColor:'#2678e8',fillOpacity:1}).addTo(map).bindPopup('你目前的位置');
  const r=Number($('radius').value);if(r){circle=L.circle([userPosition.lat,userPosition.lon],{radius:r,color:'#2678e8',weight:1,fillOpacity:.06}).addTo(map)}
  map.setView([userPosition.lat,userPosition.lon],14);
  $('statusMsg').textContent='已找到你的位置。機器已按與你目前位置的直線距離排序。';
  render();
 },err=>{$('statusMsg').textContent=err.code===1?'定位權限已被拒絕。請在 iPhone「設定」中允許 Safari 使用定位服務，然後再試一次。':'無法取得你的位置。請檢查 GPS 後再試一次。';},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
$('locateBtn').addEventListener('click',locate);
$('resetBtn').addEventListener('click',()=>{userPosition=null;if(userMarker)map.removeLayer(userMarker);if(circle)map.removeLayer(circle);$('radius').value='0';$('statusMsg').textContent='正在顯示所有符合條件的機器。按「搜尋附近的機器」可按距離排序。';map.setView([22.32,114.17],10);render()});
['search','radius','province','statusFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(circle){map.removeLayer(circle);circle=null}if(userPosition&&Number($('radius').value))circle=L.circle([userPosition.lat,userPosition.lon],{radius:Number($('radius').value),color:'#2678e8',weight:1,fillOpacity:.06}).addTo(map);render()}));
$('totalCount').textContent=MACHINES.length;$('operatingCount').textContent=MACHINES.filter(m=>m.status==='OPERATING').length;$('standbyCount').textContent=MACHINES.filter(m=>m.status==='STANDBY').length;
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
